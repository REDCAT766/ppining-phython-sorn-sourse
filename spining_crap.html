            font-size: 16px;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;

        .discord-link { color: #5865F2; }
        .github-link { color: #af9ef1; }

        .nav-links a:hover {
